<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" width="620" height="440"><style>
.hs1, .hs2 { opacity: 0; }
.pip0 { fill: #1B1B1B; } .pip1, .pip2 { fill: none; }
.bf-x, .bf-y, .bf-r, .bf-w { transform-box: view-box; transform-origin: 0 0; }
.bf-r { transform: rotate(-18deg); }
@media (prefers-reduced-motion: no-preference) {
  .hs0 { animation: hs0 10s linear infinite; } .hs1 { animation: hs1 10s linear infinite; } .hs2 { animation: hs2 10s linear infinite; }
  .pip0 { animation: pip0 10s step-end infinite; } .pip1 { animation: pip1 10s step-end infinite; } .pip2 { animation: pip2 10s step-end infinite; }
  .bf-x { animation: bfx 4.5s ease-in-out infinite alternate; }
  .bf-y { animation: bfy 2.4s ease-in-out infinite alternate; }
  .bf-r { animation: bfr 3.5s ease-in-out infinite alternate; }
  .bf-w { animation: bfw 0.227s ease-in-out infinite alternate; }
}
@keyframes hs0 { 0% { opacity: 0 } 5%, 25% { opacity: 1 } 25.01%, 100% { opacity: 0 } }
@keyframes hs1 { 0%, 25% { opacity: 0 } 30%, 50% { opacity: 1 } 50.01%, 75% { opacity: 0 } 80%, 100% { opacity: 1 } }
@keyframes hs2 { 0%, 50% { opacity: 0 } 55%, 75% { opacity: 1 } 75.01%, 100% { opacity: 0 } }
@keyframes pip0 { 0% { fill: #1B1B1B } 25% { fill: none } }
@keyframes pip1 { 0% { fill: none } 25% { fill: #1B1B1B } 50% { fill: none } 75% { fill: #1B1B1B } }
@keyframes pip2 { 0% { fill: none } 50% { fill: #1B1B1B } 75% { fill: none } }
@keyframes bfx { from { transform: translateX(-6px) } to { transform: translateX(6px) } }
@keyframes bfy { from { transform: translateY(-4px) } to { transform: translateY(4px) } }
@keyframes bfr { from { transform: rotate(-24deg) } to { transform: rotate(-12deg) } }
@keyframes bfw { from { transform: scaleX(1) } to { transform: scaleX(0.55) } }
